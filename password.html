<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Monthly Password Generator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 520px;
      margin: 40px auto;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      font-size: 16px;
    }

    #output {
      margin-top: 20px;
      font-weight: bold;
      word-break: break-all;
    }
  </style>
</head>

<body>

<h2>Deterministic Password Generator</h2>

<label>Phrase:</label>
<input type="password" id="phrase">

<label>Key (secret number or code):</label>
<input type="password" id="key">

<label>Site (e.g. gmail, bank, wifi):</label>
<input type="text" id="site">

<label>Version (manual rotation):</label>
<input type="number" id="version" value="1">

<label>Month (auto-generated):</label>
<input type="text" id="month" readonly>

<button onclick="generate()">Generate Password</button>

<div id="output"></div>

<script>
function getMonth() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
}

document.getElementById("month").value = getMonth();

async function derivePassword(phrase, key, site, version, month, length = 20) {
  const enc = new TextEncoder();

  const salt = enc.encode("Danny");

  const combined = enc.encode(
    phrase + "|" + key + "|" + site + "|v" + version + "|" + month
  );

  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    combined,
    { name: "PBKDF2" },
    false,
    ["deriveBits"]
  );

  const bits = await crypto.subtle.deriveBits(
    {
      name: "PBKDF2",
      salt: salt,
      iterations: 150000,
      hash: "SHA-256"
    },
    keyMaterial,
    256
  );

  const bytes = new Uint8Array(bits);

  let binary = "";
  for (let b of bytes) binary += String.fromCharCode(b);

  let base64 = btoa(binary)
    .replace(/\+/g, "-")
    .replace(/\//g, "_");

  let password = base64.slice(0, length).split("");

  // enforce complexity rules
  password[0] = password[0].toUpperCase();
  password[1] = password[1].toLowerCase();
  password[2] = (password[2].charCodeAt(0) % 10).toString();

  const symbols = "!@#$%^&*";
  password[3] = symbols[password[3].charCodeAt(0) % symbols.length];

  return password.join("");
}

async function generate() {
  const phrase = document.getElementById("phrase").value;
  const key = document.getElementById("key").value;
  const site = document.getElementById("site").value;
  const version = document.getElementById("version").value;
  const month = document.getElementById("month").value;

  const pwd = await derivePassword(phrase, key, site, version, month);

  document.getElementById("output").innerText =
    "Generated Password: " + pwd;
}
</script>

</body>
</html>
