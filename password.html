<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Deterministic Password Generator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root[data-theme="light"] {
      --bg-page:        #f4f4f4;
      --bg-card:        #ffffff;
      --bg-section:     #fafafa;
      --bg-input:       #ffffff;
      --bg-input-ro:    #f0f0f0;
      --bg-btn-copy:    #ffffff;
      --border:         #e8e8e8;
      --border-input:   #dddddd;
      --border-hover:   #bbbbbb;
      --text-primary:   #1a1a1a;
      --text-secondary: #555555;
      --text-muted:     #888888;
      --text-label:     #666666;
      --accent:         #4a90e2;
      --accent-hover:   #357abd;
      --badge-up-bg:    #dbeafe; --badge-up-tx:  #1d4ed8;
      --badge-lo-bg:    #dcfce7; --badge-lo-tx:  #15803d;
      --badge-dg-bg:    #fef9c3; --badge-dg-tx:  #92400e;
      --badge-sy-bg:    #fee2e2; --badge-sy-tx:  #b91c1c;
      --err-bg:         #fff0f0; --err-tx:       #c0392b; --err-bd: #f5c6c6;
      --strength-track: #eeeeee;
      --toggle-bg:      #e0e0e0;
      --toggle-knob:    #ffffff;
      --shadow:         0 2px 16px rgba(0,0,0,0.09);
    }
    :root[data-theme="dark"] {
      --bg-page:        #0f1117;
      --bg-card:        #1a1d27;
      --bg-section:     #141720;
      --bg-input:       #1f2330;
      --bg-input-ro:    #181b24;
      --bg-btn-copy:    #1f2330;
      --border:         #2a2d3a;
      --border-input:   #2f3347;
      --border-hover:   #4a4f6a;
      --text-primary:   #e8eaf0;
      --text-secondary: #9aa0b8;
      --text-muted:     #6b7290;
      --text-label:     #8890aa;
      --accent:         #5b9ef7;
      --accent-hover:   #4a8ae8;
      --badge-up-bg:    #1e2d4a; --badge-up-tx:  #7eb3f8;
      --badge-lo-bg:    #1a2e22; --badge-lo-tx:  #6ed89a;
      --badge-dg-bg:    #2e2710; --badge-dg-tx:  #f0c060;
      --badge-sy-bg:    #2e1a1a; --badge-sy-tx:  #f08080;
      --err-bg:         #2e1a1a; --err-tx:       #f08080; --err-bd: #5a2a2a;
      --strength-track: #2a2d3a;
      --toggle-bg:      #5b9ef7;
      --toggle-knob:    #ffffff;
      --shadow:         0 2px 24px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg-page);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
      transition: background 0.25s;
    }

    .pg-wrap {
      background: var(--bg-card);
      border-radius: 14px;
      box-shadow: var(--shadow);
      padding: 2rem;
      width: 100%;
      max-width: 520px;
      transition: background 0.25s, box-shadow 0.25s;
    }

    .pg-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .pg-header-left { display: flex; align-items: center; gap: 10px; flex: 1; }
    .pg-header i.pg-icon { font-size: 22px; color: var(--text-muted); }
    .pg-header h2 { font-size: 20px; font-weight: 600; color: var(--text-primary); }

    .pg-theme-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      user-select: none;
    }
    .pg-theme-toggle i { font-size: 15px; color: var(--text-muted); transition: color 0.2s; }
    .pg-toggle-track {
      width: 38px;
      height: 21px;
      border-radius: 999px;
      background: var(--toggle-bg);
      position: relative;
      transition: background 0.25s;
      flex-shrink: 0;
    }
    .pg-toggle-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--toggle-knob);
      transition: transform 0.25s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.25);
    }
    [data-theme="dark"] .pg-toggle-knob { transform: translateX(17px); }

    .pg-section {
      background: var(--bg-section);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      transition: background 0.25s, border-color 0.25s;
    }

    .pg-section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pg-field { margin-bottom: 0.85rem; }
    .pg-field:last-child { margin-bottom: 0; }

    .pg-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-label);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 5px;
      display: block;
    }

    .pg-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .pg-input-wrap > i:first-child {
      position: absolute;
      left: 10px;
      font-size: 16px;
      color: var(--text-muted);
      pointer-events: none;
    }
    .pg-input-wrap input {
      width: 100%;
      padding: 9px 36px 9px 34px;
      font-size: 14px;
      border: 1px solid var(--border-input);
      border-radius: 8px;
      background: var(--bg-input);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s, background 0.25s, color 0.25s;
    }
    .pg-input-wrap input:focus { border-color: var(--accent); }
    .pg-input-wrap input[readonly] {
      background: var(--bg-input-ro);
      color: var(--text-muted);
    }

    .pg-eye {
      position: absolute;
      right: 9px;
      font-size: 16px;
      color: var(--text-muted);
      cursor: pointer;
      pointer-events: all;
      transition: color 0.15s;
    }
    .pg-eye:hover { color: var(--text-secondary); }

    .pg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pg-divider { border: none; border-top: 1px solid var(--border); margin: 0.75rem 0; transition: border-color 0.25s; }

    .pg-slider-row { display: flex; align-items: center; gap: 12px; }
    .pg-slider-row input[type=range] { flex: 1; accent-color: var(--accent); cursor: pointer; }
    .pg-slider-val {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      min-width: 72px;
      text-align: right;
    }

    .pg-gen-btn {
      width: 100%;
      padding: 11px;
      font-size: 15px;
      font-weight: 600;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
    }
    .pg-gen-btn:hover { background: var(--accent-hover); }
    .pg-gen-btn:active { transform: scale(0.98); }

    .pg-error {
      background: var(--err-bg);
      color: var(--err-tx);
      border: 1px solid var(--err-bd);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      margin-top: 8px;
      display: none;
      transition: background 0.25s;
    }
    .pg-error.visible { display: block; }

    .pg-result {
      background: var(--bg-section);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-top: 1rem;
      display: none;
      transition: background 0.25s, border-color 0.25s;
    }
    .pg-result.visible { display: block; }

    .pg-result-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }

    .pg-pwd-wrap { display: flex; align-items: center; gap: 10px; }
    .pg-pwd {
      font-family: 'Courier New', monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      word-break: break-all;
      flex: 1;
      letter-spacing: 0.05em;
    }

    .pg-copy-btn {
      background: var(--bg-btn-copy);
      border: 1px solid var(--border-input);
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .pg-copy-btn:hover { background: var(--bg-section); border-color: var(--border-hover); }

    .pg-strength { margin-top: 12px; }
    .pg-strength-bar {
      height: 5px;
      border-radius: 3px;
      background: var(--strength-track);
      overflow: hidden;
      margin-bottom: 4px;
      transition: background 0.25s;
    }
    .pg-strength-fill { height: 100%; border-radius: 3px; transition: width 0.4s, background 0.4s; }
    .pg-strength-label { font-size: 12px; color: var(--text-muted); }

    .pg-composition { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .pg-badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; transition: background 0.25s, color 0.25s; }
    .pg-badge-upper  { background: var(--badge-up-bg); color: var(--badge-up-tx); }
    .pg-badge-lower  { background: var(--badge-lo-bg); color: var(--badge-lo-tx); }
    .pg-badge-digit  { background: var(--badge-dg-bg); color: var(--badge-dg-tx); }
    .pg-badge-symbol { background: var(--badge-sy-bg); color: var(--badge-sy-tx); }

    .pg-spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="pg-wrap">

  <div class="pg-header">
    <div class="pg-header-left">
      <i class="ti ti-lock pg-icon" aria-hidden="true"></i>
      <h2>Deterministic Password Generator</h2>
    </div>
    <div class="pg-theme-toggle" onclick="toggleTheme()" role="button" aria-label="Toggle dark mode" tabindex="0">
      <i class="ti ti-sun" aria-hidden="true" id="icon-sun"></i>
      <div class="pg-toggle-track"><div class="pg-toggle-knob"></div></div>
      <i class="ti ti-moon" aria-hidden="true" id="icon-moon"></i>
    </div>
  </div>

  <div class="pg-section">
    <div class="pg-section-title">
      <i class="ti ti-key" aria-hidden="true"></i> Secrets (never transmitted)
    </div>
    <div class="pg-field">
      <label class="pg-label" for="phrase">Passphrase</label>
      <div class="pg-input-wrap">
        <i class="ti ti-lock" aria-hidden="true"></i>
        <input type="password" id="phrase" placeholder="your master phrase">
        <i class="ti ti-eye pg-eye" role="button" aria-label="Toggle passphrase visibility" onclick="toggleVis('phrase', this)"></i>
      </div>
    </div>
    <div class="pg-field">
      <label class="pg-label" for="key">Personal key</label>
      <div class="pg-input-wrap">
        <i class="ti ti-fingerprint" aria-hidden="true"></i>
        <input type="password" id="key" placeholder="secret number or code">
        <i class="ti ti-eye pg-eye" role="button" aria-label="Toggle key visibility" onclick="toggleVis('key', this)"></i>
      </div>
    </div>
  </div>

  <div class="pg-section">
    <div class="pg-section-title">
      <i class="ti ti-settings" aria-hidden="true"></i> Parameters (public)
    </div>
    <div class="pg-field">
      <label class="pg-label" for="site">Site / service</label>
      <div class="pg-input-wrap">
        <i class="ti ti-world" aria-hidden="true"></i>
        <input type="text" id="site" placeholder="gmail, bank, wifi…">
      </div>
    </div>
    <div class="pg-row">
      <div class="pg-field">
        <label class="pg-label" for="version">Version</label>
        <div class="pg-input-wrap">
          <i class="ti ti-history" aria-hidden="true"></i>
          <input type="number" id="version" value="1" min="1">
        </div>
      </div>
      <div class="pg-field">
        <label class="pg-label" for="month">Month (auto)</label>
        <div class="pg-input-wrap">
          <i class="ti ti-calendar" aria-hidden="true"></i>
          <input type="text" id="month" readonly>
        </div>
      </div>
    </div>
    <hr class="pg-divider">
    <div class="pg-field">
      <label class="pg-label" for="length">Password length — <span id="len-val">24</span> characters</label>
      <div class="pg-slider-row">
        <input type="range" id="length" min="12" max="64" value="24" step="1"
          oninput="document.getElementById('len-val').textContent = this.value">
      </div>
    </div>
    <div class="pg-field">
      <label class="pg-label" for="symdensity">Symbol density</label>
      <div class="pg-slider-row">
        <input type="range" id="symdensity" min="1" max="5" value="3" step="1"
          oninput="document.getElementById('sym-val').textContent = ['minimal','low','medium','high','maximum'][this.value - 1]">
        <span class="pg-slider-val" id="sym-val">medium</span>
      </div>
    </div>
  </div>

  <button class="pg-gen-btn" onclick="generate()">
    <span class="pg-spinner" id="spinner"></span>
    <i class="ti ti-shield-lock" aria-hidden="true" id="btn-icon"></i>
    <span id="btn-text">Generate password</span>
  </button>
  <div class="pg-error" id="error"></div>

  <div class="pg-result" id="result">
    <div class="pg-result-label">Generated password</div>
    <div class="pg-pwd-wrap">
      <div class="pg-pwd" id="pwd-display"></div>
      <button class="pg-copy-btn" onclick="copyPwd()" id="copy-btn">
        <i class="ti ti-copy" aria-hidden="true"></i> copy
      </button>
    </div>
    <div class="pg-strength">
      <div class="pg-strength-bar">
        <div class="pg-strength-fill" id="strength-fill"></div>
      </div>
      <div class="pg-strength-label" id="strength-label"></div>
    </div>
    <div class="pg-composition" id="composition"></div>
  </div>

</div>
<script>
  function getMonth() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  document.getElementById("month").value = getMonth();

  function toggleTheme() {
    const root = document.documentElement;
    root.setAttribute("data-theme", root.getAttribute("data-theme") === "dark" ? "light" : "dark");
  }

  function toggleVis(id, el) {
    const inp = document.getElementById(id);
    const showing = inp.type === "password";
    inp.type = showing ? "text" : "password";
    el.className = "ti " + (showing ? "ti-eye-off" : "ti-eye") + " pg-eye";
  }

  async function derivePassword(phrase, key, site, version, month, length, symDensity) {
    const enc = new TextEncoder();
    const salt = enc.encode("deterministicpwgen-v2-salt-2025");
    const combined = enc.encode([phrase, key, site, "v" + version, month].join("|"));

    const km = await crypto.subtle.importKey("raw", combined, { name: "PBKDF2" }, false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt, iterations: 200000, hash: "SHA-256" },
      km, 512
    );
    const bytes = new Uint8Array(bits);

    const upper   = "ABCDEFGHJKLMNPQRSTUVWXYZ";
    const lower   = "abcdefghjkmnpqrstuvwxyz";
    const digits  = "23456789";
    const symbols = "!@#$%^&*()-_=+[]{}|;:,.<>?";

    const symRatios = [0.05, 0.10, 0.18, 0.28, 0.38];
    const symRatio  = symRatios[symDensity - 1];
    const symCount  = Math.max(3, Math.round(length * symRatio));
    const digCount  = Math.max(2, Math.round(length * 0.15));
    const upCount   = Math.max(2, Math.round(length * 0.20));
    const loCount   = Math.max(1, length - symCount - digCount - upCount);

    const pick = (charset, b) => charset[b % charset.length];
    let pool = [], bi = 0;

    for (let i = 0; i < upCount;  i++) pool.push(pick(upper,   bytes[bi++ % bytes.length]));
    for (let i = 0; i < loCount;  i++) pool.push(pick(lower,   bytes[bi++ % bytes.length]));
    for (let i = 0; i < digCount; i++) pool.push(pick(digits,  bytes[bi++ % bytes.length]));
    for (let i = 0; i < symCount; i++) pool.push(pick(symbols, bytes[bi++ % bytes.length]));

    for (let i = pool.length - 1; i > 0; i--) {
      const j = bytes[(bi + i) % bytes.length] % (i + 1);
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }

    if (!/[A-Z]/.test(pool[0])) {
      const fi = pool.findIndex(c => /[A-Z]/.test(c));
      if (fi > 0) [pool[0], pool[fi]] = [pool[fi], pool[0]];
    }

    return pool.join("");
  }

  function getStrength(pwd) {
    let score = 0;
    if (pwd.length >= 16) score++;
    if (pwd.length >= 24) score++;
    if (/[A-Z]/.test(pwd)) score++;
    if (/[a-z]/.test(pwd)) score++;
    if (/[0-9]/.test(pwd)) score++;
    if (/[^A-Za-z0-9]/.test(pwd)) score++;
    if ((pwd.match(/[^A-Za-z0-9]/g) || []).length >= 4) score++;
    const levels = [
      { label: "weak",        color: "#e74c3c", width: "20%"  },
      { label: "fair",        color: "#e67e22", width: "40%"  },
      { label: "good",        color: "#f1c40f", width: "60%"  },
      { label: "strong",      color: "#27ae60", width: "80%"  },
      { label: "very strong", color: "#2980b9", width: "100%" }
    ];
    return levels[Math.min(Math.floor(score / 1.5), 4)];
  }

  function countTypes(pwd) {
    return {
      upper:  (pwd.match(/[A-Z]/g)        || []).length,
      lower:  (pwd.match(/[a-z]/g)        || []).length,
      digit:  (pwd.match(/[0-9]/g)        || []).length,
      symbol: (pwd.match(/[^A-Za-z0-9]/g) || []).length,
    };
  }

  async function generate() {
    const phrase  = document.getElementById("phrase").value.trim();
    const key     = document.getElementById("key").value.trim();
    const site    = document.getElementById("site").value.trim();
    const version = document.getElementById("version").value;
    const month   = document.getElementById("month").value;
    const length  = parseInt(document.getElementById("length").value);
    const symDen  = parseInt(document.getElementById("symdensity").value);
    const errEl   = document.getElementById("error");
    const resEl   = document.getElementById("result");

    if (!phrase || !key || !site) {
      errEl.textContent = "Passphrase, personal key, and site are all required.";
      errEl.classList.add("visible");
      resEl.classList.remove("visible");
      return;
    }
    errEl.classList.remove("visible");

    document.getElementById("spinner").style.display  = "block";
    document.getElementById("btn-icon").style.display = "none";
    document.getElementById("btn-text").textContent   = "Generating…";

    const pwd = await derivePassword(phrase, key, site, version, month, length, symDen);

    document.getElementById("spinner").style.display  = "none";
    document.getElementById("btn-icon").style.display = "";
    document.getElementById("btn-text").textContent   = "Generate password";

    document.getElementById("pwd-display").textContent = pwd;

    const s = getStrength(pwd);
    document.getElementById("strength-fill").style.background = s.color;
    document.getElementById("strength-fill").style.width      = s.width;
    document.getElementById("strength-label").textContent     = "Strength: " + s.label;

    const ct = countTypes(pwd);
    document.getElementById("composition").innerHTML =
      `<span class="pg-badge pg-badge-upper">${ct.upper} uppercase</span>` +
      `<span class="pg-badge pg-badge-lower">${ct.lower} lowercase</span>` +
      `<span class="pg-badge pg-badge-digit">${ct.digit} digits</span>`   +
      `<span class="pg-badge pg-badge-symbol">${ct.symbol} symbols</span>`;

    resEl.classList.add("visible");
    document.getElementById("copy-btn").innerHTML =
      '<i class="ti ti-copy" aria-hidden="true"></i> copy';
  }

  async function copyPwd() {
    const pwd = document.getElementById("pwd-display").textContent;
    await navigator.clipboard.writeText(pwd);
    const btn = document.getElementById("copy-btn");
    btn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i> copied';
    setTimeout(() => { btn.innerHTML = '<i class="ti ti-copy" aria-hidden="true"></i> copy'; }, 2000);
  }
</script>
</body>
</html>
