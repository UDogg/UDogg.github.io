<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Utkarsh Choudhary Portfolio</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <style>
    /* Global Styles */
    body {
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }

    .container {
      width: 90%;
      margin: auto;
    }

    h1 {
      text-align: center;
      padding: 20px 0;
    }

    .button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      transition: background-color 0.3s, transform 0.3s;
      cursor: pointer;
      margin: 10px 0;
      display: inline-block;
    }

    .button:hover {
      background-color: #0056b3;
      transform: scale(1.1);
    }

    /* Animated Name */
    @keyframes slideIn {
      0% {
        opacity: 0;
        transform: translateX(-100%);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .name {
      font-size: 2.5rem;
      font-weight: bold;
      color: #333;
      text-align: center;
      margin-top: 50px;
      animation: slideIn 1s ease-in-out;
    }

    /* Skills Section */
    .skills {
      display: flex;
      justify-content: space-around;
      margin-top: 40px;
    }

    .skill-card {
      background-color: white;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .skill-card:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .progress-bar {
      background-color: #e0e0e0;
      border-radius: 5px;
      margin-top: 10px;
      width: 100%;
      height: 10px;
      overflow: hidden;
    }

    .progress {
      background-color: #007bff;
      height: 100%;
      transition: width 1s ease-in-out;
    }

    /* Project Section */
    .project-section {
      margin-top: 40px;
    }

    .project-thumbnail {
      width: 100%;
      height: 200px;
      background-color: #ccc;
      animation: loading 1s infinite alternate;
    }

    @keyframes loading {
      0% {
        background-color: #e0e0e0;
      }
      100% {
        background-color: #f0f0f0;
      }
    }

    .project {
      margin-bottom: 30px;
    }

    .project img {
      width: 100%;
      height: auto;
    }

    .github-stats {
      text-align: center;
      margin-top: 40px;
    }

    .github-stats img {
      width: 100%;
      max-width: 400px;
    }

    .lottie {
      text-align: center;
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Animated Name Section -->
    <div class="name">Utkarsh Choudhary</div>

    <!-- Button Section -->
    <div class="button-container" style="text-align: center;">
      <a href="https://threejs-black.vercel.app/" class="button" target="_blank">View 3D Portfolio</a>
    </div>

    <!-- Skills Section with Progress Bars -->
    <h1>My Skills</h1>
    <div class="skills">
      <div class="skill-card">
        <h3>Python</h3>
        <div class="progress-bar">
          <div class="progress" style="width: 90%;"></div>
        </div>
      </div>
      <div class="skill-card">
        <h3>JavaScript</h3>
        <div class="progress-bar">
          <div class="progress" style="width: 80%;"></div>
        </div>
      </div>
      <div class="skill-card">
        <h3>React</h3>
        <div class="progress-bar">
          <div class="progress" style="width: 85%;"></div>
        </div>
      </div>
    </div>

    <!-- Projects Section with GIFs -->
    <div class="project-section">
      <h1>My Projects</h1>

      <div class="project">
        <h3>3D Portfolio Website</h3>
        <img src="https://media.giphy.com/media/xT5LMzIK1AdZJld7Jm/giphy.gif" alt="3D Portfolio GIF" />
      </div>

      <div class="project">
        <h3>Ziggy Calculator</h3>
        <img src="https://media.giphy.com/media/26gsjCZpPolPr3s8s/giphy.gif" alt="Ziggy Calculator GIF" />
      </div>

      <div class="project">
        <h3>JBOD Manipulation Web Server</h3>
        <div class="project-thumbnail"></div>
      </div>
    </div>

    <!-- GitHub Stats Section -->
    <div class="github-stats">
      <h1>GitHub Stats</h1>
      <img src="https://github-readme-stats.vercel.app/api?username=UDogg&show_icons=true&theme=radical" alt="GitHub Stats" />
      <img src="https://github-readme-stats.vercel.app/api/top-langs/?username=UDogg&layout=compact&theme=radical" alt="Top Languages" />
    </div>

    <!-- Lottie Animation -->
    <div class="lottie">
      <h1>Check Out My Lottie Animation</h1>
      <lottie-player
        src="https://assets3.lottiefiles.com/packages/lf20_YOUR_ANIMATION.json"
        background="transparent"
        speed="1"
        style="width: 300px; height: 300px"
        loop
        autoplay
      ></lottie-player>
    </div>
  </div>

  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</body>
</html>
